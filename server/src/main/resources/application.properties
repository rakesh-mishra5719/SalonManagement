server.port=8080
spring.application.name=salon-management-server

# Persistent Disk-based database for development & local scale
# Data is permanently saved in ./data/salondb across server restarts
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/salondb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson formatting
spring.jackson.serialization.indent_output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Async task & SSE configuration for high concurrency
spring.mvc.async.request-timeout=120000

# Logging
logging.level.com.salon=INFO
