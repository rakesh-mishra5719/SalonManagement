server.port=8080
spring.application.name=salon-management-server

# H2 Database configuration for fast development & testing
spring.datasource.url=jdbc:h2:mem:salondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson formatting
spring.jackson.serialization.indent_output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Async task & SSE configuration for high concurrency
spring.mvc.async.request-timeout=120000

# Logging
logging.level.com.salon=INFO
